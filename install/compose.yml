# One Enterprise Brain installation on one machine (NFR-12; install/README.md). Driven by ./install/brain, which
# adds compose.ports.yml (no domains: the chat on 8065 and the brain on 9120) or compose.tls.yml (domains: Caddy
# with Let's Encrypt). Image pins match infra/compose.yml; scripts/lib/compose.test.ts checks that.
# Nothing publishes a port here; the services talk to each other by name on the project's network.

x-postgres-image: &postgres-image postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 10s

# Settings every service of ours reads (docs/brain/01-phase0-plan.md section 11; the schemas in packages/*/config.ts).
x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL}
  STATE_DATABASE_URL: ${STATE_DATABASE_URL}
  KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
  OPS_HOST: ${OPS_HOST}
  RELAY_HTTP_URL: ${RELAY_HTTP_URL}
  RELAY_WS_URL: ${RELAY_WS_URL}
  READER_SECRET_KEY: ${READER_SECRET_KEY}
  RELAY_REQUESTS_PER_SECOND: ${RELAY_REQUESTS_PER_SECOND}
  MM_URL: ${MM_URL}
  MM_API_URL: http://mattermost:8065
  MM_REQUESTS_PER_SECOND: ${MM_REQUESTS_PER_SECOND}

x-service: &service
  image: enterprise-brain/services:install
  build:
    context: ..
    dockerfile: infra/services/Dockerfile
  restart: unless-stopped
  depends_on:
    state-postgres:
      condition: service_healthy
    relay:
      condition: service_healthy
    mattermost:
      condition: service_healthy

services:
  # --- Enterprise Brain chat (our Mattermost build, D48) ---
  mattermost:
    image: enterprise-brain/chat:11.11.1-eb1
    build:
      context: ../infra/chat
      platforms: [linux/amd64]
    platform: linux/amd64
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${MM_DB_PASSWORD}@mm-postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      # Configuration lives in the database, so settings the seed applies survive upgrades (as on staging).
      MM_CONFIG: postgres://mmuser:${MM_DB_PASSWORD}@mm-postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MM_URL}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
    volumes:
      - mm-data:/mattermost/data
      - mm-plugins:/mattermost/plugins
      - mm-client-plugins:/mattermost/client/plugins
    depends_on:
      mm-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/mattermost/bin/mmctl", "system", "status", "--local"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  mm-postgres:
    image: *postgres-image
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${MM_DB_PASSWORD}
    volumes:
      - mm-postgres-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    restart: unless-stopped

  # --- Buzz relay (adapted from block/buzz deploy/compose/compose.yml; infra/third_party/buzz) ---
  relay:
    image: ghcr.io/block/buzz:0.2.1@sha256:4e31b7c7abb7d00b6f513dc559e58d2b980416f1dc400aa01bcf762cf2989cfc
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://buzz:${BUZZ_DB_PASSWORD}@buzz-postgres:5432/buzz
      REDIS_URL: redis://:${BUZZ_REDIS_PASSWORD}@buzz-redis:6379
      BUZZ_S3_ENDPOINT: http://buzz-s3:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET}
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_GIT_HOOK_HMAC_SECRET: ${BUZZ_GIT_HOOK_HMAC_SECRET}
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      RELAY_OWNER_PUBKEY: ${RELAY_OWNER_PUBKEY}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY}
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      RELAY_URL: ${RELAY_WS_URL}
      BUZZ_PUSH_GATEWAY_DELIVERY_URL: ""
      BUZZ_RATE_LIMIT_HUMAN_API_CALLS_PER_MIN: ${BUZZ_RATE_LIMIT_HUMAN_API_CALLS_PER_MIN}
      BUZZ_RATE_LIMIT_HUMAN_WS_EVENTS_PER_SEC: ${BUZZ_RATE_LIMIT_HUMAN_WS_EVENTS_PER_SEC}
      BUZZ_MEDIA_BASE_URL: ${RELAY_HTTP_URL}/media
      RUST_LOG: buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
    volumes:
      - buzz-git-data:/data/git
    depends_on:
      buzz-postgres:
        condition: service_healthy
      buzz-redis:
        condition: service_healthy
      buzz-s3:
        condition: service_healthy
      buzz-s3-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  buzz-postgres:
    image: *postgres-image
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${BUZZ_DB_PASSWORD}
    volumes:
      - buzz-postgres-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    restart: unless-stopped

  buzz-redis:
    image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${BUZZ_REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${BUZZ_REDIS_PASSWORD}
    volumes:
      - buzz-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  buzz-s3:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY}
    volumes:
      - buzz-s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  buzz-s3-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      buzz-s3:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://buzz-s3:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
      '
    restart: "no"

  # --- Our state database, with pgvector (D52) ---
  state-postgres:
    image: enterprise-brain/state-postgres:17.11-pgvector-0.8.7
    build:
      context: ../infra/state-postgres
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${STATE_DB_PASSWORD}
    volumes:
      - state-postgres-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    restart: unless-stopped

  # --- Our services (one image, one program each) ---
  bridge:
    <<: *service
    command: ["node", "--import", "tsx", "packages/bridge/src/main.ts"]
    environment:
      <<: *common-env
      MM_BRIDGE_TOKEN: ${MM_BRIDGE_TOKEN}
      BRIDGE_SECRET_KEY: ${BRIDGE_SECRET_KEY}
      BACKFILL_DAYS: ${BACKFILL_DAYS}
      RELAY_OVERLAP_SECONDS: ${RELAY_OVERLAP_SECONDS}
      CATCH_UP_INTERVAL_SECONDS: ${CATCH_UP_INTERVAL_SECONDS}
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS}
      BRAIN_CAPTURE_CHANNELS: ${BRAIN_CAPTURE_CHANNELS}
      CAPTURE_SWEEP_SECONDS: ${CAPTURE_SWEEP_SECONDS}
      BRIDGE_OPS_PORT: ${BRIDGE_OPS_PORT}

  agent-runtime:
    <<: *service
    command: ["node", "--import", "tsx", "packages/agent-runtime/src/main.ts"]
    environment:
      <<: *common-env
      MAX_EVENT_AGE_SECONDS: ${MAX_EVENT_AGE_SECONDS}
      RELAY_OVERLAP_SECONDS: ${RELAY_OVERLAP_SECONDS}
      MAX_REPLIES_PER_THREAD: ${MAX_REPLIES_PER_THREAD}
      REPLY_WINDOW_SECONDS: ${REPLY_WINDOW_SECONDS}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY}
      AGENT_REFRESH_SECONDS: ${AGENT_REFRESH_SECONDS}
      CONTEXT_CHAR_BUDGET: ${CONTEXT_CHAR_BUDGET}
      LLM_PROVIDER: ${LLM_PROVIDER}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_EFFORT: ${LLM_EFFORT}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_MODEL_FAST: ${GEMINI_MODEL_FAST}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      MODEL_PRICES_JSON: ${MODEL_PRICES_JSON}
      RUNTIME_OPS_PORT: ${RUNTIME_OPS_PORT}

  ingestion:
    <<: *service
    command: ["node", "--import", "tsx", "packages/ingestion/src/main.ts"]
    environment:
      <<: *common-env
      INGEST_DEBOUNCE_SECONDS: ${INGEST_DEBOUNCE_SECONDS}
      INGEST_CHUNK_CHARS: ${INGEST_CHUNK_CHARS}
      RELAY_OVERLAP_SECONDS: ${RELAY_OVERLAP_SECONDS}
      CATCH_UP_INTERVAL_SECONDS: ${CATCH_UP_INTERVAL_SECONDS}
      INGESTION_OPS_PORT: ${INGESTION_OPS_PORT}

  brain-api:
    <<: *service
    command: ["node", "--import", "tsx", "packages/brain-api/src/main.ts"]
    environment:
      <<: *common-env
      MM_BRIDGE_TOKEN: ${MM_BRIDGE_TOKEN}
      MM_ADMIN_TOKEN: ${MM_ADMIN_TOKEN}
      MM_TEAM_NAME: ${MM_TEAM_NAME}
      BRIDGE_SECRET_KEY: ${BRIDGE_SECRET_KEY}
      BRAIN_API_HOST: ${BRAIN_API_HOST}
      BRAIN_API_PORT: ${BRAIN_API_PORT}
      BRAIN_PUBLIC_URL: ${BRAIN_PUBLIC_URL}
      BRAIN_INTERNAL_URL: ${BRAIN_INTERNAL_URL}
      BRAIN_API_TOKEN: ${BRAIN_API_TOKEN}
      BRAIN_SESSION_SECRET: ${BRAIN_SESSION_SECRET}
      BRAIN_SESSION_HOURS: ${BRAIN_SESSION_HOURS}
      BRAIN_TIMEZONE: ${BRAIN_TIMEZONE}
      BRAIN_FEATURE_API: ${BRAIN_FEATURE_API}
      BRAIN_FEATURE_CHAT_COMMANDS: ${BRAIN_FEATURE_CHAT_COMMANDS}
      BRAIN_FEATURE_SEMANTIC_SEARCH: ${BRAIN_FEATURE_SEMANTIC_SEARCH}
      EMBED_INTERVAL_SECONDS: ${EMBED_INTERVAL_SECONDS}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE}
      LLM_PROVIDER: ${LLM_PROVIDER}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_EFFORT: ${LLM_EFFORT}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_MODEL_FAST: ${GEMINI_MODEL_FAST}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      MODEL_PRICES_JSON: ${MODEL_PRICES_JSON}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.BRAIN_API_PORT || 9120) + '/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # --- The installer: `init`, `seed`, `selftest`, `summary` (profile tools; ./install/brain runs it) ---
  installer:
    image: enterprise-brain/services:install
    build:
      context: ..
      dockerfile: infra/services/Dockerfile
    profiles: [tools]
    user: root
    volumes:
      - ./:/install
    environment:
      ENV_FILE: /install/config.env
      MM_API_URL: http://mattermost:8065
      BRAIN_INTERNAL_URL: ${BRAIN_INTERNAL_URL}
    entrypoint: ["node", "--import", "tsx", "scripts/install/run.ts"]
    restart: "no"

volumes:
  mm-data:
  mm-plugins:
  mm-client-plugins:
  mm-postgres-data:
  buzz-postgres-data:
  buzz-redis-data:
  buzz-s3-data:
  buzz-git-data:
  state-postgres-data:
